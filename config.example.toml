# ─────────────────────────────────────────────
#  pipabobik — налаштування
#  Скопіюйте у config.toml (майстер --setup зробить це сам)
# ─────────────────────────────────────────────

[twitch]
# Канал, у чаті якого працює бот (ваш нік на Twitch, маленькими літерами)
channel = ""
# Дані застосунку з https://dev.twitch.tv/console/apps
client_id = ""
client_secret = ""
# Логіни, які теж можуть керувати музикою (крім стрімера і модераторів)
admins = []
# Помічники: можуть лише пропускати треки й міняти гучність.
# Зручніше додавати їх у застосунку: вкладка «Правила» → «Помічники»
helpers = []

[google]
# Логін Google для YouTube Music.
# "firefox" — взяти вхід із Firefox (рекомендовано: Chrome не віддає cookies стороннім програмам)
# ""        — без логіну
cookies_from_browser = "firefox"
# Або шлях до експортованого cookies.txt (має пріоритет над браузером)
cookies_file = ""
# Що грати, коли черга порожня:
# "LM" — ваші вподобані в YouTube Music (потрібен логін)
# ""   — тиша
# або ID чи посилання будь-якого плейлиста YouTube/YT Music
fallback_playlist = "LM"
# Чи перемішувати фоновий плейлист
fallback_shuffle = true

[player]
# Шлях до mpv. "mpv" = знайти автоматично
mpv_path = "mpv"
volume = 60
# Вирівнювання гучності між треками
normalize = true
# Пристрій виводу (порожньо = системний). Список: mpv --audio-device=help
audio_device = ""
# Windows: mpv відкривається згорнутим вікном «pipabobik» —
# інакше OBS «Захоплення звуку програми» не бачить його у списку
show_window = true

[rules]
# Ліміти для всіх глядачів (0 = без обмежень). Для сабів, VIP, помічників
# і модераторів — свої в секціях [limits.*] нижче або в застосунку («Команди»)
# Максимальна тривалість треку, секунд
max_duration = 420
# Скільки треків одна людина може мати в черзі одночасно
max_per_user = 2
# Пауза між замовленнями однієї людини, секунд
cooldown = 30
# Максимум треків у черзі
max_queue = 30
# true = шукати лише серед «Пісень» YouTube Music (без кліпів, «10 годин…» тощо)
only_songs = true
# Блокувати треки з позначкою Explicit
block_explicit = false
# Слова, з якими треки не додаються (назва або виконавець)
banned_words = []
# true = замовлення одразу перебиває фонову музику (не чекає кінця треку з плейлиста)
interrupt_fallback = true
# Автоматично банити російську музику: російських виконавців і пісні російською
block_russian = true
# Додаткові виконавці, яких фільтр має банити (якщо щось проскочило)
russian_artists = []

[commands]
# Можна змінювати назви та додавати синоніми
request = ["!трек", "!sr", "!songrequest", "!request", "!req", "!track", "!замовити", "!ік", "!nhtr"]
now     = ["!шоце", "!song"]
skip    = ["!скіп", "!скип", "!skip", "!next"]
queue   = ["!черга", "!queue"]
wrong   = ["!нетой", "!wrongsong"]
volume  = ["!гучність", "!vol"]
seek    = ["!перемотка", "!мотай", "!seek"]
pause   = ["!пауза", "!pause"]
play    = ["!грай", "!play"]
ban     = ["!бантрек"]
help    = ["!музика", "!pipabobik"]

[permissions]
# Хто може користуватися командою: "all" (усі), "subs", "vip", "helpers", "mods".
# Ролі додаються: саб-VIP отримує все, що дозволено і сабам, і VIP. Стрімер може все.
# Зручніше міняти в застосунку: вкладка «Команди»
request = ["all"]
now     = ["all"]
queue   = ["all"]
wrong   = ["all"]
help    = ["all"]
skip    = ["helpers", "mods"]
volume  = ["helpers", "mods"]
seek    = ["mods"]
pause   = ["mods"]
play    = ["mods"]
ban     = ["mods"]

# Ліміти замовлень для окремих ролей. custom = false — як у всіх глядачів.
# Якщо в людини кілька ролей, діють найщедріші ліміти.
[limits.subs]
custom = false
max_per_user = 3
cooldown = 15
max_duration = 600
bypass_queue = false

[limits.vip]
custom = false
max_per_user = 3
cooldown = 15
max_duration = 600
bypass_queue = false

[limits.helpers]
custom = false
max_per_user = 3
cooldown = 15
max_duration = 600
bypass_queue = false

[limits.mods]
# 0 = без обмежень; bypass_queue — можна замовляти навіть у переповнену чергу
custom = true
max_per_user = 0
cooldown = 0
max_duration = 0
bypass_queue = true

[chat]
# Писати в чат, коли починає грати новий трек
announce_tracks = false
# Привітання на початку трансляції
greet_on_stream_start = true

[server]
# Порт локального сервера (віджет, панель, авторизація)
port = 17777
